<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c7ed6">
  <title>Noord-Spanje 2026</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="banner">Nog niet gekoppeld aan Supabase — wijzigingen worden <b>niet</b> bewaard. Zie README.md.</div>
  <main id="app"></main>

  <nav id="nav">
    <button class="nav-btn active" data-view="dashboard"><span>🏠</span>Start</button>
    <button class="nav-btn" data-view="planning"><span>🗓️</span>Planning</button>
    <button class="nav-btn" data-view="verblijven"><span>🏕️</span>Verblijf</button>

    <button class="nav-btn" data-view="checklist"><span>✅</span>Lijst</button>
  </nav>
  <div id="sync"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>

</html>
